openapi: 3.1.0
info:
  title: Nexo API
  version: 0.1.0
  description: |
    API REST do nexo-server. Autenticação por cookie de sessão (login Google em /oauth2/authorization/google).
    Rotas que alteram estado exigem o cabeçalho X-XSRF-TOKEN. Erros em Problem Details (RFC 9457).
    Mensagens, aprovações e parada de turno vão pelo WebSocket (asyncapi.yaml).
servers:
  - url: http://localhost:8080
security:
  - session: []
tags:
  - name: identidade
  - name: contextos
  - name: conversas
  - name: catalogo
  - name: busca

paths:
  /api/me:
    get:
      tags: [identidade]
      summary: Usuário logado
      operationId: getMe
      responses:
        "200":
          description: Usuário
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401": { $ref: "#/components/responses/Problem" }

  /api/auth/logout:
    post:
      tags: [identidade]
      summary: Encerra a sessão (mantém as credenciais Google)
      operationId: logout
      parameters: [{ $ref: "#/components/parameters/Xsrf" }]
      responses:
        "204": { description: Sessão encerrada }

  /api/auth/disconnect:
    post:
      tags: [identidade]
      summary: Revoga o token no Google, apaga credenciais, desliga contextos e encerra a sessão
      operationId: disconnect
      parameters: [{ $ref: "#/components/parameters/Xsrf" }]
      responses:
        "204": { description: Desconectado }

  /api/contexts:
    get:
      tags: [contextos]
      summary: Contextos com estado do usuário
      operationId: listContexts
      responses:
        "200":
          description: Contextos na ordem de exibição
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContextResponse" }

  /api/contexts/{key}/enable:
    post:
      tags: [contextos]
      summary: Liga um contexto (pode exigir consentimento incremental)
      operationId: enableContext
      parameters:
        - { $ref: "#/components/parameters/ContextKey" }
        - { $ref: "#/components/parameters/Xsrf" }
      responses:
        "200":
          description: Ligado ou consentimento necessário
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextActivationResponse" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/contexts/{key}/disable:
    post:
      tags: [contextos]
      summary: Desliga um contexto (não revoga escopos no Google)
      operationId: disableContext
      parameters:
        - { $ref: "#/components/parameters/ContextKey" }
        - { $ref: "#/components/parameters/Xsrf" }
      responses:
        "200":
          description: Contexto desligado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextResponse" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/conversations:
    post:
      tags: [conversas]
      summary: Cria conversa
      operationId: createConversation
      parameters: [{ $ref: "#/components/parameters/Xsrf" }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConversationRequest" }
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
    get:
      tags: [conversas]
      summary: Lista conversas do usuário (mais recentes primeiro)
      operationId: listConversations
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: before, in: query, description: "updatedAt da última conversa da página anterior", schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Conversas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConversationResponse" }

  /api/conversations/{id}:
    parameters: [{ $ref: "#/components/parameters/ConversationId" }]
    get:
      tags: [conversas]
      summary: Detalhe com lastSeq e turno ativo
      operationId: getConversation
      responses:
        "200":
          description: Conversa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [conversas]
      summary: Renomeia
      operationId: renameConversation
      parameters: [{ $ref: "#/components/parameters/Xsrf" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameConversationRequest" }
      responses:
        "200":
          description: Renomeada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [conversas]
      summary: Apaga a conversa e tudo dela
      operationId: deleteConversation
      parameters: [{ $ref: "#/components/parameters/Xsrf" }]
      responses:
        "204": { description: Apagada }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/conversations/{id}/events:
    get:
      tags: [conversas]
      summary: Eventos gravados (mesmo formato do WebSocket)
      operationId: readEvents
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - { name: afterSeq, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        "200":
          description: Eventos em ordem de seq
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventResponse" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/conversations/{id}/approvals:
    get:
      tags: [conversas]
      summary: Aprovações da conversa
      operationId: listApprovals
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ApprovalStatus" } }
      responses:
        "200":
          description: Aprovações
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApprovalResponse" }

  /api/catalog:
    get:
      tags: [catalogo]
      summary: Visão geral do catálogo
      operationId: describeCatalog
      responses:
        "200":
          description: Contagens por contexto, namespace e arestas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogOverviewResponse" }

  /api/catalog/tools:
    get:
      tags: [catalogo]
      summary: Lista ferramentas
      operationId: listTools
      parameters:
        - { name: context, in: query, schema: { type: string } }
        - { name: namespace, in: query, schema: { type: string } }
      responses:
        "200":
          description: Ferramentas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ToolResponse" }

  /api/catalog/tools/{name}:
    get:
      tags: [catalogo]
      summary: Detalhe de uma ferramenta
      operationId: getTool
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9_]{1,63}$" } }
      responses:
        "200":
          description: Ferramenta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolResponse" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/catalog/plan:
    get:
      tags: [catalogo]
      summary: Ordem de execução (fecho + Kahn por níveis)
      operationId: planExecution
      parameters:
        - name: tools
          in: query
          required: true
          style: form
          explode: false
          schema: { type: array, items: { type: string }, minItems: 1 }
      responses:
        "200":
          description: Plano
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionPlanResponse" }

  /api/search:
    post:
      tags: [busca]
      summary: RAG + DAG com os contextos do usuário logado
      operationId: selectTools
      parameters: [{ $ref: "#/components/parameters/Xsrf" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelectToolsRequest" }
      responses:
        "200":
          description: Seleção
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolSelectionResponse" }

  /api/search/history:
    get:
      tags: [busca]
      summary: Últimas buscas do usuário
      operationId: listSearchHistory
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Histórico
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ToolSelectionResponse" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: SESSION

  parameters:
    Xsrf:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema: { type: string }
    ContextKey:
      name: key
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ContextKey" }
    ConversationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Erro (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, examples: ["https://nexo.dev/problems/nao-autenticado"] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

    ContextKey:
      type: string
      enum: [gmail, drive, docs, sheets, slides, calendar, chat, people]

    MeResponse:
      type: object
      required: [id, email, displayName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        pictureUrl: { type: [string, "null"], format: uri }

    ContextResponse:
      type: object
      required: [key, name, description, enabled, scopesGranted, scopes, toolCount]
      properties:
        key: { $ref: "#/components/schemas/ContextKey" }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        scopesGranted: { type: boolean, description: "Todos os escopos do contexto já foram concedidos" }
        scopes: { type: array, items: { type: string } }
        toolCount: { type: integer }

    ContextActivationResponse:
      type: object
      required: [status, context]
      properties:
        status: { type: string, enum: [enabled, consent_required] }
        context: { $ref: "#/components/schemas/ContextKey" }
        authorizationUrl: { type: string, description: "Presente quando status = consent_required" }

    CreateConversationRequest:
      type: object
      properties:
        title: { type: string, maxLength: 120 }

    RenameConversationRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }

    ConversationResponse:
      type: object
      required: [id, title, lastSeq, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        lastSeq: { type: integer, minimum: 0 }
        activeTurn:
          type: [object, "null"]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [RUNNING, WAITING_APPROVAL] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EventResponse:
      type: object
      required: [kind, seq, conversationId, type, at, payload]
      properties:
        kind: { const: event }
        seq: { type: integer, minimum: 1 }
        conversationId: { type: string, format: uuid }
        turnId: { type: [string, "null"], format: uuid }
        type: { type: string }
        at: { type: string, format: date-time }
        payload: { type: object }

    ApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, EXPIRED, CONSUMED]

    ApprovalResponse:
      type: object
      required: [id, turnId, callId, tool, description, severity, arguments, status, expiresAt]
      properties:
        id: { type: string, format: uuid }
        turnId: { type: string, format: uuid }
        callId: { type: string }
        tool: { type: string }
        description: { type: string }
        severity: { type: string, enum: [warning, danger] }
        arguments: { type: object }
        status: { $ref: "#/components/schemas/ApprovalStatus" }
        expiresAt: { type: string, format: date-time }
        decidedAt: { type: [string, "null"], format: date-time }

    ToolParameterResponse:
      type: object
      required: [ordinal, name, type, description, required]
      properties:
        ordinal: { type: integer }
        name: { type: string }
        type: { type: string, enum: [string, integer, number, boolean, array] }
        description: { type: string }
        required: { type: boolean }
        minimum: { type: [number, "null"] }
        maximum: { type: [number, "null"] }
        enum: { type: [array, "null"], items: { type: string } }
        items: { type: [object, "null"] }

    ToolResponse:
      type: object
      required: [name, namespace, context, effect, description, parameters, dependsOn, dependents, level]
      properties:
        name: { type: string }
        namespace: { type: string }
        context: { $ref: "#/components/schemas/ContextKey" }
        effect: { type: string, enum: [READ, WRITE, DESTRUCTIVE] }
        description: { type: string }
        parameters: { type: array, items: { $ref: "#/components/schemas/ToolParameterResponse" } }
        dependsOn: { type: array, items: { type: string } }
        dependents: { type: array, items: { type: string } }
        level: { type: integer, minimum: 0 }

    CatalogOverviewResponse:
      type: object
      required: [contexts, namespaces, tools, dependencies]
      properties:
        contexts: { type: integer }
        namespaces: { type: integer }
        tools: { type: integer }
        dependencies: { type: integer }
        byContext:
          type: array
          items:
            type: object
            properties:
              context: { $ref: "#/components/schemas/ContextKey" }
              tools: { type: integer }
              namespaces: { type: array, items: { type: string } }

    ExecutionPlanResponse:
      type: object
      required: [requested, steps]
      properties:
        requested: { type: array, items: { type: string } }
        steps:
          type: array
          items:
            type: object
            required: [step, tool, level, prerequisites]
            properties:
              step: { type: integer }
              tool: { type: string }
              level: { type: integer }
              prerequisites: { type: array, items: { type: string } }

    SelectToolsRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 2000 }
        strategy: { type: string, enum: [FULL_TEXT, VECTOR, HYBRID], default: HYBRID }
        topK: { type: integer, minimum: 1, maximum: 20, default: 5 }
        applyDag: { type: boolean, default: true }

    ToolSelectionResponse:
      type: object
      required: [searchId, query, strategy, topK, applyDag, tools, blocked, durationMs]
      properties:
        searchId: { type: integer }
        query: { type: string }
        strategy: { type: string, enum: [FULL_TEXT, VECTOR, HYBRID] }
        topK: { type: integer }
        applyDag: { type: boolean }
        durationMs: { type: integer }
        tools:
          type: array
          items:
            type: object
            required: [step, name, origin, score]
            properties:
              step: { type: integer }
              name: { type: string }
              origin: { type: string, enum: [RAG, DAG] }
              score: { type: number }
              level: { type: [integer, "null"] }
        blocked:
          type: array
          items:
            type: object
            required: [name, missingContexts]
            properties:
              name: { type: string }
              missingContexts: { type: array, items: { $ref: "#/components/schemas/ContextKey" } }
