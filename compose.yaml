# PostgreSQL 17 com pgvector. As tabelas e as 50 ferramentas do Google são criadas pelas
# migrations do Flyway quando o nexo-server sobe (nexo-server/src/main/resources/db/migration).
# Porta 5433 no host para não brigar com um Postgres local na 5432.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nexo-postgres
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - nexo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nexo-data:
